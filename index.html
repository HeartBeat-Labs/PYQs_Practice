<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling and prevents unwanted zooming on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PYQs Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="screen active">
        <header class="menu-header">
            <h1>PYQs Practice</h1>
        </header>
        
        <!-- Dedicated container for Loading and Error messages to prevent CSS grid conflicts -->
        <div id="menu-message" class="menu-message"></div>

        <!-- The Day 1, Day 2 blocks will be injected here by Javascript -->
        <main id="menu-grid" class="menu-container"></main>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen hidden">
        <div class="top-bar">
            <button id="btn-return-menu" class="top-btn">⬅ Menu</button>
            <h2 id="quiz-title">Day 1</h2>
            <span id="question-counter">1 / 150</span>
        </div>

        <div id="question-area">
            <p id="question-text">Loading question...</p>
            
            <div id="options-container">
                <!-- Option buttons injected here dynamically -->
            </div>
        </div>

        <div class="bottom-bar">
            <button id="btn-prev" class="bottom-btn" disabled>Previous</button>
            <button id="btn-next" class="bottom-btn">Next</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen hidden">
        <div class="result-container">
            <h2>Quiz Completed!</h2>
            <h3 id="result-day-title">Day X</h3>
            
            <div class="result-stats">
                <div class="stat-box correct-box">
                    <span class="stat-label">Right</span>
                    <span id="res-correct" class="stat-value">0</span>
                </div>
                <div class="stat-box wrong-box">
                    <span class="stat-label">Wrong</span>
                    <span id="res-wrong" class="stat-value">0</span>
                </div>
                <div class="stat-box unattempted-box">
                    <span class="stat-label">Unattempted</span>
                    <span id="res-unattempted" class="stat-value">0</span>
                </div>
            </div>
            
            <button id="btn-result-menu" class="action-btn">Return to Menu</button>
        </div>
    </div>

    <!-- CUSTOM DIALOG BOX OVERLAY -->
    <div id="dialog-overlay" class="hidden">
        <div class="dialog-box">
            <h3 id="dialog-title">Quiz Status</h3>
            <p id="dialog-message">What would you like to do?</p>
            <div class="dialog-buttons">
                <button id="dialog-btn-1" class="dialog-btn primary-btn">Option 1</button>
                <button id="dialog-btn-2" class="dialog-btn secondary-btn">Option 2</button>
                <button id="dialog-btn-cancel" class="dialog-btn cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
